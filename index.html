<style>
  html { scroll-behavior: smooth; background: #04050A; }
  body { background: #04050A; color: #F4F5F7; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Subtle grain over hero/feature surfaces */
  .grain::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 25% 30%, rgba(255,255,255,.04) 50%, transparent 51%),
      radial-gradient(1px 1px at 75% 70%, rgba(255,255,255,.03) 50%, transparent 51%);
    background-size: 3px 3px, 5px 5px;
    mix-blend-mode: overlay; opacity:.6;
  }

  .halo{
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(127,190,255,.18), transparent 70%),
      radial-gradient(30% 30% at 80% 100%, rgba(255,79,139,.10), transparent 70%);
  }

  .stripe-placeholder{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 2px, transparent 2px 16px),
      linear-gradient(180deg, #141821, #06070A);
  }
  /* legacy class kept for component compatibility — now uses LIGHT BLUE tint */
  .stripe-blood{
    background:
      repeating-linear-gradient(135deg, rgba(127,190,255,.10) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #11161E, #06070A);
  }

  .hairline { border-color: rgba(255,255,255,.07); }

  /* === BUTTONS ===================================================== */
  /* Primary CTA: hot PINK (used sparingly). Hover lifts. */
  .btn-primary{
    background:#FF4F8B; color:#0A0B0E; font-weight:600; letter-spacing:.02em;
    box-shadow: 0 14px 40px -12px rgba(255,79,139,.55), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn-primary:hover{ transform: translateY(-1px); background:#FF6699; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  /* Ghost: light-blue accent edge on hover */
  .btn-ghost{
    border:1px solid rgba(255,255,255,.14); color:#F4F5F7;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .btn-ghost:hover{ border-color: rgba(127,190,255,.55); background: rgba(127,190,255,.06); transform: translateY(-1px); }

  .chip{
    display:inline-flex; align-items:center; gap:.5rem;
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.02);
    color:#BCE0FF;
    font-family: "JetBrains Mono", monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    padding:.4rem .7rem; border-radius:999px;
  }

  /* === FORMS ======================================================= */
  .field{
    width:100%; background: rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.10);
    color:#F4F5F7; padding: 14px 16px; border-radius: 4px; outline:none;
    font-size:14px; transition: border-color .15s, background .15s;
  }
  .field:focus{ border-color: rgba(127,190,255,.55); background: rgba(127,190,255,.04); }
  .field::placeholder{ color:#5B6070; }
  .field-label{ font-family: "JetBrains Mono", monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#8A92A3; }

  /* Native <select> + <option>: force solid dark dropdown so option text
     is readable (was white-on-white in the OS popup). */
  select.field { background-color:#0F1117; color:#F4F5F7; cursor:pointer; }
  select.field option { background-color:#0F1117; color:#F4F5F7; }
  select.field option:checked { background-color:#1B202C; color:#7FBEFF; }

  /* === SCROLLBAR =================================================== */
  ::-webkit-scrollbar { width: 10px; height:10px; }
  ::-webkit-scrollbar-track { background:#06070A; }
  ::-webkit-scrollbar-thumb { background:#1B202C; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background:#3A4256; }

  /* === BEFORE / AFTER HANDLE ======================================= */
  /* Slider handle: PINK so it pops over photography */
  .ba-handle{
    position:absolute; top:0; bottom:0; width:2px; background:#FF4F8B;
    box-shadow: 0 0 22px rgba(255,79,139,.6);
    cursor: ew-resize; z-index: 6;
  }
  .ba-handle::after{
    content:""; position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    width:40px; height:40px; border-radius:999px;
    background: #06070A; border:2px solid #FF4F8B;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  .ba-handle::before{
    content:""; position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    width:10px; height:10px;
    background: transparent;
    border-left:2px solid #FF4F8B; border-right:2px solid #FF4F8B;
  }

  /* === KEYFRAMES =================================================== */
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee-track { animation: marquee 42s linear infinite; }

  @keyframes spinner {
    to { transform: rotate(360deg); }
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.12); border-top-color: #7FBEFF;
    animation: spinner .9s linear infinite;
  }

  @keyframes bead-drift {
    0%   { transform: translateY(0)   scale(1); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(120%) scale(.6); opacity: 0; }
  }

  /* === MODEL VIEWER ================================================ */
  model-viewer {
    --poster-color: transparent;
    background: transparent;
    width: 100%;
    height: 100%;
  }

  /* === FOCUS ======================================================= */
  :focus-visible{ outline: 2px solid #7FBEFF; outline-offset: 2px; }

  /* === UTIL ======================================================== */
  .text-balance { text-wrap: balance; }
  .text-pretty  { text-wrap: pretty; }
</style>
